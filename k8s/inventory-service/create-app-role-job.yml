apiVersion: batch/v1
kind: Job
metadata: { name: inventory-db-create-app-role, namespace: dev }
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                { secretKeyRef: { name: inventory-db-admin, key: password } }
            - name: APP_PASS
              valueFrom:
                {
                  secretKeyRef:
                    {
                      name: inventory-service-secret,
                      key: SPRING_DATASOURCE_PASSWORD,
                    },
                }
          command: ["sh", "-c"]
          args:
            - |
              psql -h inventory-db -U inventory_admin -d inventorydb -v ON_ERROR_STOP=1 -v app_pass="$APP_PASS" <<'SQL'
              SELECT EXISTS (SELECT FROM pg_roles WHERE rolname = 'inventory_user') AS role_exists \gset
              \if :role_exists
              ALTER ROLE inventory_user WITH PASSWORD :'app_pass';
              \else
              CREATE ROLE inventory_user LOGIN PASSWORD :'app_pass';
              \endif
              GRANT CREATE, USAGE ON SCHEMA public TO inventory_user;
              SQL
