apiVersion: v1
kind: Service
metadata: { name: notification-db, namespace: dev }
spec:
  clusterIP: None
  selector: { app: notification-db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: notification-db, namespace: dev }
spec:
  serviceName: notification-db
  replicas: 1
  selector:
    matchLabels: { app: notification-db }
  template:
    metadata:
      labels: { app: notification-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: notificationdb }
            - { name: POSTGRES_USER, value: notification_admin }
            - name: POSTGRES_PASSWORD
              valueFrom:
                { secretKeyRef: { name: notification-db-admin, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              { command: ["pg_isready", "-U", "notification_user", "-d", "notificationdb"] }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard 
        resources: { requests: { storage: 1Gi } }
