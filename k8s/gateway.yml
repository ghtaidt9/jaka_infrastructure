apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: eg }
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: dev }
spec:
  gatewayClassName: eg
  listeners:
    - { name: http, protocol: HTTP, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: dev }
spec:
  parentRefs: [{ name: web }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/orders } }]
      backendRefs: [{ name: order-service, port: 8081 }]
    - matches: [{ path: { type: PathPrefix, value: /api/payments } }]
      backendRefs: [{ name: payment-service, port: 8082 }]
    - matches: [{ path: { type: PathPrefix, value: /api/inventory } }]
      backendRefs: [{ name: inventory-service, port: 8083 }]
    - matches: [{ path: { type: PathPrefix, value: /api/notifications } }]
      backendRefs: [{ name: notification-service, port: 8084 }]