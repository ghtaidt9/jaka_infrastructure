apiVersion: v1
kind: Service
metadata: { name: payment-redis, namespace: dev }
spec:
  clusterIP: None
  selector: { app: payment-redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: payment-redis, namespace: dev }
spec:
  serviceName: payment-redis
  replicas: 1
  selector:
    matchLabels: { app: payment-redis }
  template:
    metadata:
      labels: { app: payment-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: { requests: { storage: 1Gi } }

