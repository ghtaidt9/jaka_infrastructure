image: { repository: inventory-service }
port: 8083
contextPath: /api/inventory
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventorydb
  SPRING_DATASOURCE_USERNAME: inventory_user
  KAFKA_BOOTSTRAP: jaka-kafka-bootstrap.kafka:9092
secretName: inventory-service-secret
replicaCount: 4
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { memory: 1536Mi }
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 10
  